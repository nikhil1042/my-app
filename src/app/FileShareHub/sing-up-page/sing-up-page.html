<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Sign up to continue</p>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <input type="text" formControlName="name" placeholder="Full Name" />
        <small *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.invalid">
          Name is required
        </small>
      </div>

      <div class="form-group">
        <input type="email" formControlName="email" placeholder="Email Address" />
        <small *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
          Valid email is required
        </small>
      </div>

      <div class="form-group">
        <input type="password" formControlName="password" placeholder="Password" />
        <small *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
          Password must be at least 6 characters
        </small>
      </div>

      <div class="form-group">
        <select formControlName="role">
          <option value="" disabled selected>Select Role</option>
          <option value="user">User</option>
          <option value="developer">Developer</option>
        </select>
        <small *ngIf="signupForm.get('role')?.touched && signupForm.get('role')?.invalid">
          Please select a role
        </small>
      </div>

      <button type="submit" class="auth-btn" [disabled]="signupForm.invalid">
        Sign Up
      </button>
    </form>

    <div class="switch-auth">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
