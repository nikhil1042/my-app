<div class="auth-wrapper">
  <div class="auth-card">

    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <!-- Email -->
      <div class="form-group">
        <input type="email"
               placeholder="Email Address"
               formControlName="email">
        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Valid email required
        </small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <input type="password"
               placeholder="Password"
               formControlName="password">
        <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required
        </small>
      </div>

      <!-- Developer Access Code -->
      <div class="form-group" *ngIf="developerMode">
        <input type="password"
               placeholder="Developer Access Code"
               formControlName="accessCode">
        <small *ngIf="loginForm.get('accessCode')?.touched && loginForm.get('accessCode')?.invalid">
          Access code required for developer
        </small>
      </div>

      <button type="submit" class="primary-btn">
        Login
      </button>

      <div class="divider">OR</div>

      <!-- Role Switch Buttons -->
      <div class="role-switch">
        <button type="button"
                [class.active]="!developerMode"
                (click)="setDeveloperMode(false)">
          User Login
        </button>

        <button type="button"
                [class.active]="developerMode"
                (click)="setDeveloperMode(true)">
          Developer Login
        </button>
      </div>

    </form>

  </div>
</div>
